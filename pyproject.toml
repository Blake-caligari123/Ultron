[project]
name = "ultron"
version = "0.2.0"
description = "Paper-only research engine and live paper trading floor for 1m-30m gold and bitcoin strategies (no broker, no orders)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "numba>=0.68.1",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""          # the package is ./ultron (not src/ultron)

[tool.pytest.ini_options]
testpaths = ["tests"]
